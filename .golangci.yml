# See https://golangci-lint.run/docs/linters/configuration/
version: "2"
run:
  tests: true
linters:
  default: all
  disable:
    - modernize
    - nestif
    - gocognit
    - funlen
    - misspell
    - gocyclo
    - nlreturn
    - cyclop
    - wsl
    - exhaustruct_v5
    - embeddedstructfieldcheck
    - nilnil
    - noinlineerr
    - wsl_v5
    - funcorder
    - copyloopvar
    - depguard
    - dupword
    - errname
    - exhaustruct
    - forbidigo
    - forcetypeassert
    - gochecknoglobals
    - intrange
    - ireturn
    - lll
    - mnd
    - nonamedreturns
    - paralleltest
    - recvcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - varnamelen
    - wrapcheck
    - err113 # sentinel errors are only worth it where callers match them
    - exhaustive # strategy and mode switches are intentionally partial
    - gochecknoinits # init builds lookup tables
    - maintidx # ported libzstd functions keep their shape
  settings:
    dupl:
      threshold: 100
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/cespare/xxhash/v2.Digest).Write # never fails
    gosec:
      excludes:
        - G104 # hash writes never fail
        - G103 # unsafe is used deliberately, only to pass pointers to assembly
        - G115 # integer conversions in a codec are range-checked by construction
        - G602 # slice bounds hints in hot loops
    nakedret:
      max-func-lines: 150
    gocritic:
      disabled-checks:
        - captLocal # L, as in libzstd
        - ifElseChain
    staticcheck:
      checks: [all, -QF1001, -QF1006]
    nolintlint:
      allow-unused: true # some directives apply to one GOARCH only
    predeclared:
      ignore: [min, max]
    gocyclo:
      min-complexity: 20
    misspell:
      locale: US
    unparam:
      check-exported: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
          - dupl
          - funlen
          - goconst
          - mnd
          - noctx
          - unparam
          - unused
          - errcheck
          - errorlint
          - thelper
          - prealloc
          - makezero
          - perfsprint
          - unconvert
          - godot
          - testpackage
        path: _test.go
      - linters:
          - errcheck
          - gosec
        path: example_
      - linters:
          - revive
        text: 'unused-parameter: parameter|redefines-builtin-id|empty-block'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
